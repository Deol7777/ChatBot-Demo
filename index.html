<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Education Planner Landing</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
  <header>
    <div class="top-strip">
      <div class="top-strip-inner">
        <a href="#">SIGN IN</a>
        <a href="#">CREATE ACCOUNT</a>
      </div>
    </div>

    <nav class="main-nav">
      <div class="nav-inner">
        <div class="left-pills">
          <button class="pill green">Plan</button>
          <button class="pill blue">Search</button>
          <button class="pill yellow">Path</button>
          <button class="pill pink">Apply</button>
        </div>

        <div class="brand">
          <img src="image.png" alt="EducationPlannerBC" class="brand-image" />
        </div>

        <div class="right-actions">
          <button class="btn help">Help</button>
          <button class="btn list">Go to My List <i class="fa-solid fa-star"></i></button>
        </div>
      </div>
    </nav>
  </header>

  <main class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>Welcome to EducationPlannerBC.</h1>
      <h2>Your journey starts here.</h2>

      <div class="hero-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span></span>
        <i class="fa-solid fa-arrow-right"></i>
      </div>

      <div class="hero-cards">
        <div class="hero-card">
          <button class="pill green lg">Plan</button>
          <p>Plan your journey to post-secondary.</p>
        </div>
        <div class="hero-card">
          <button class="pill blue lg">Search</button>
          <p>Search for programs and institutions.</p>
        </div>
        <div class="hero-card">
          <button class="pill yellow lg">Find Your Path</button>
          <p>Find your education and career path.</p>
        </div>
        <div class="hero-card">
          <button class="pill pink lg">Apply</button>
          <p>Apply to your chosen program(s).</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Your widget -->
  <elevenlabs-convai
        agent-id="agent_7701kjpkxqhwfzdvnhr2ya403dn4"
        style="position: fixed; top: 140px; right: 10px;">
    </elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
    <script>
        const observedRoots = new WeakSet();

        const removeElevenLabsBranding = root => {
            if (!root || !root.querySelectorAll) {
                return;
            }

            root.querySelectorAll('p.whitespace-nowrap').forEach(p => {
              const el = p.querySelector('a');
              const text = (el?.textContent || p.textContent || '').trim();

              if (text.includes('ElevenAgents')) {
                p.remove(); // remove the outer <p> container
              }
            });
        };

        const attachObserver = root => {
            if (!root || observedRoots.has(root) || !root.querySelectorAll) {
                return;
            }

            observedRoots.add(root);
            domObserver.observe(root, { childList: true, subtree: true });
            removeElevenLabsBranding(root);
        };

        const domObserver = new MutationObserver(mutations => {
            removeElevenLabsBranding(document);

            mutations.forEach(mutation => {
                mutation.addedNodes.forEach(node => {
                    if (!(node instanceof Element)) {
                        return;
                    }

                    removeElevenLabsBranding(node);

                    if (node.shadowRoot) {
                        attachObserver(node.shadowRoot);
                    }

                    node.querySelectorAll && node.querySelectorAll('*').forEach(child => {
                        if (child.shadowRoot) {
                            attachObserver(child.shadowRoot);
                        }
                    });
                });
            });
        });

        attachObserver(document);
        attachObserver(document.body);

        setInterval(() => {
            removeElevenLabsBranding(document);
            document.querySelectorAll('elevenlabs-convai').forEach(element => {
                if (element.shadowRoot) {
                    attachObserver(element.shadowRoot);
                }
            });
        }, 500);
    </script>
</body>
</html>
